<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pynmapper</title>
  <style>
    :root { color-scheme: dark; }
    body { margin: 0; padding: 16px; font: 14px/1.4 system-ui, sans-serif; background: #0e1117; color: #d7dde5; }
    h1 { font-size: 18px; margin: 0 0 8px; }
    .meta { color: #8b96a5; margin-bottom: 12px; }
    pre { background: #161b24; padding: 12px; border-radius: 6px; overflow: auto; max-height: 70vh; }
  </style>
</head>
<body>
  <h1>Pynmapper — placeholder page</h1>
  <div class="meta" id="meta">loading /api/map…</div>
  <pre id="out"></pre>
  <script>
    // Milestone 2 placeholder: proves the server + JSON contract work end to end.
    // Milestone 3 replaces this file with the three.js scene.
    async function refresh() {
      try {
        const res = await fetch("/api/map");
        const map = await res.json();
        document.getElementById("meta").textContent =
          `revision ${map.revision} · ${map.hosts.length} hosts · ${map.links.length} links · scan ${map.scan.type} ${map.scan.network ?? ""}`;
        document.getElementById("out").textContent = JSON.stringify(map, null, 2);
      } catch (err) {
        document.getElementById("meta").textContent = `fetch failed: ${err}`;
      }
    }
    refresh();
    setInterval(refresh, 2000);
  </script>
</body>
</html>
