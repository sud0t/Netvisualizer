[package]
name = "netvisualizer-scanner"
description = "Finds the hosts on a network for Netvisualizer: ARP and ping sweeps, traceroute, MAC addresses, reverse DNS, TCP and UDP port scans"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
dns-lookup = "4.0.2"
if-addrs = "0.15.0"
ipnet = "2.12.2"
libc = "0.2.191"
serde.workspace = true
serde_json.workspace = true
socket2 = { version = "0.6.5", features = ["all"] }
tokio = { workspace = true, features = ["rt", "net", "time", "sync", "process", "macros"] }
