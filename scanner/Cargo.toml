[package]
name = "netvisualizer-scanner"
description = "Finds the hosts on a network for Netvisualizer: ping sweep, reverse DNS, TCP connect scan"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
dns-lookup = "4.0.2"
if-addrs = "0.15.0"
ipnet = "2.12.2"
libc = "0.2.191"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
socket2 = { version = "0.6.5", features = ["all"] }
tokio = { version = "1.54.1", features = ["rt", "net", "time", "sync", "process", "macros"] }
