[package]
name = "netvisualizer"
description = "Netvisualizer: finds the hosts on a network and shows them as a 3D map in its own window (Bevy)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
# Versions checked on crates.io 2026-10-20.
# bevy_egui must be the release built for this exact Bevy minor; bump them together.
bevy = { version = "0.20.0", features = ["wayland", "png"] }
# The egui release built for Bevy 0.20 (compatibility table in bevy_egui's README).
# `render` draws egui over the Bevy frame; `default_fonts` ships the fonts the
# labels and sidebar use; `manage_clipboard` lets the filter box paste. The
# default `open_url` (a browser launcher) and `picking` (bevy_picking bridge)
# are left out: nothing here needs them.
bevy_egui = { version = "0.43.1", default-features = false, features = ["render", "default_fonts", "manage_clipboard"] }
serde.workspace = true
serde_json.workspace = true
clap = { version = "4.6", features = ["derive"] }
# Same wgpu Bevy renders with; used directly only to probe for a GPU adapter
# before Bevy starts (see startup.rs).
wgpu = { version = "30", default-features = false }
# The networking side (../scanner): finds the hosts. scan.rs decides which
# of its steps run, in what order, and turns their results into maps.
scanner = { version = "0.1.0", path = "../scanner", package = "netvisualizer-scanner" }
# The scanner is async; scan.rs gives each scan a runtime on its own thread.
tokio = { workspace = true, features = ["rt"] }
# Embeds Python (python.rs) for the parts that stay in Python. Links the
# libpython named in .cargo/config.toml: a Python upgrade means a rebuild.
# `auto-initialize` starts the interpreter on first use.
pyo3 = { workspace = true, features = ["auto-initialize"] }

[features]
# `cargo run --features dev` links Bevy as a shared library: rebuilds after a
# source edit take seconds instead of minutes. Never use it for a release build.
dev = ["bevy/dynamic_linking"]

[build-dependencies]
# build.rs: the rpath to the libpython PyO3 links (see .cargo/config.toml).
pyo3-build-config.workspace = true
